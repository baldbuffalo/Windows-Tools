name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish WinUI 3 single-file app
        shell: pwsh
        run: dotnet publish WindowsTools.WinUI/WindowsTools.WinUI.csproj -c Release -r win-x64 --self-contained true /p:PublishReadyToRun=true -o ./output

      - name: Move latest tag
        shell: bash
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          git tag -f latest ${{ github.sha }}
          git push origin -f refs/tags/latest

      - name: Clear old release assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest --json assets --jq '.assets[].name' 2>/dev/null \
            | xargs -I{} gh release delete-asset latest {} --yes 2>/dev/null || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Windows Tools (Latest)
          draft: false
          prerelease: false
          files: ./output/WindowsTools.exe
          generate_release_notes: false
          body: |
            ## Windows Tools — WinUI 3

            Self-contained, unpackaged single EXE. No MSIX or separate .NET / Windows App SDK runtime installation is required. Dependencies are extracted to a temporary directory on first launch.

            **Install:** download WindowsTools.exe and run it. Choose Install to copy it to Program Files and create desktop / Start menu shortcuts, or run it without installing.

            **Features:**
            - Storage: view drive capacity, used/free space, and usage bars
            - Driver Hub: detect CPU/GPU/OEM and open or install manufacturer tools
            - Windows Update: open Windows Update in Settings
            - Settings: startup update checks and application update lookup
